<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="stylesheet" href="css/diseñoDashboard.css">
    <!-- Librerias -->
        <!-- Google fonts -->
            <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=search" />
        <!-- Maptiler -->
            <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
            <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- Fin -->    
</head>
<body>
    <header>
        <nav>
            <img src="img/Logo.png" alt="">
        </nav>
    </header>

    <!-- Contenedor Principal (Flex Layout) -->
    <div id="contenedorMapa">
        <aside id="barraLateral">
            <div id="contenedorBusqueda">
                <span class="material-symbols-outlined">search</span>
                <input 
                    type="text" 
                    id="busqueda-municipio" 
                    list="lista-municipios" 
                    placeholder="Escriba tu departamento"
                >
            </div>
            
            <div id="contenedorContratos">
                <!-- <div class="tarjeta-contrato">
                    <h4 class="contrato-titulo">Título</h4>
                    <p class="contrato-ciudad">📍 Cali, Valle del Cauca</p>

                    <div class="contrato-footer">
                    <span class="contrato-estado borrador">Estado</span>
                    <span class="contrato-valor">Dinero</span>
                </div> -->
            </div>
        </aside>
        <div id="map"></div>
    </div>
    <script src="js/dashboardJS.js"></script>
    <!-- Script de inicialización de Leaflet dentro del body -->
    <script>
      const key = 'RZCdXvHWkcaPtBKkGDs9';
      const map = L.map('map').setView([3.432134584669465, -76.5270243539928], 13);
      
      L.tileLayer(`https://api.maptiler.com/maps/streets-v4/{z}/{x}/{y}.png?key=${key}`,{
        tileSize: 512,
        zoomOffset: -1,
        minZoom: 1,
        attribution: "\u003ca href=\"https://www.maptiler.com/copyright/\" target=\"_blank\"\u003e\u0026copy; MapTiler\u003c/a\u003e \u003ca href=\"https://www.openstreetmap.org/copyright\" target=\"_blank\"\u003e\u0026copy; OpenStreetMap contributors\u003c/a\u003e",
        crossOrigin: true
      }).addTo(map);
    </script>
</body>
</html>
